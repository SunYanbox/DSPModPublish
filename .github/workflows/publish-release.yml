# 手动打包发布：从草稿 Release 取回 DLL → 按项目打成 zip → 上传回 Release。
#
# 用法（在 Actions 页面点「Run workflow」）：
#   1. 先在 Releases 页面新建一个草稿 Release，把这次要发的 n 个 DLL 拖进它的 assets；
#   2. 选 projects（auto 会按 DLL 文件名自动对上包目录，也可以显式选项目）；
#   3. 首次建议勾 dry_run，只看 Artifacts 和 Summary，不写 Release。
#
# workflow_dispatch 的表单不能选文件，所以 DLL 的「上传区」是这个草稿 Release。

name: 打包并发布 Release

run-name: 打包发布（${{ inputs.projects }}）${{ inputs.dry_run && ' · 演练' || '' }}

on:
  workflow_dispatch:
    inputs:
      projects:
        description: '要打包的项目：auto = 按上传的 DLL 自动对应；all = 全部；或逗号/空格分隔的包目录名、manifest name'
        type: string
        default: auto
      mapping:
        description: '手动映射，每行 `dll文件名=包目录名`；DLL 名字和包目录对不上时用这个'
        type: string
        default: ''
      source_release:
        description: 'DLL 所在 Release 的 tag；留空 = 用最新创建的草稿 Release'
        type: string
        default: ''
      publish:
        description: '上传完成后立即正式发布 Release（取消勾选则留作草稿，等你在网页点 Publish release）'
        type: boolean
        default: true
      dry_run:
        description: '只打包，不写 Release（结果看 Artifacts 与运行摘要）'
        type: boolean
        default: false
      overwrite:
        description: '修复场景：允许 tag 已存在、覆盖同名压缩包（正常发版请先升 version_number）'
        type: boolean
        default: false
      skip_dependency_check:
        description: '跳过「玩法包 pin 的 Framework 版本必须等于仓库 Framework 版本」的检查'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    name: 准备（取 DLL、校验、算 tag）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
      prevTag: ${{ steps.plan.outputs.prevTag }}
      packageCount: ${{ steps.plan.outputs.packageCount }}
    steps:
      - uses: actions/checkout@v4

      - name: 取回 DLL、校验包内容并生成打包计划
        id: plan
        env:
          INPUT_PROJECTS: ${{ inputs.projects }}
          INPUT_MAPPING: ${{ inputs.mapping }}
          INPUT_SOURCE_RELEASE: ${{ inputs.source_release }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_OVERWRITE: ${{ inputs.overwrite }}
          INPUT_SKIP_DEPENDENCY_CHECK: ${{ inputs.skip_dependency_check }}
        run: pwsh -NoProfile -File .github/scripts/prepare.ps1

      - name: 上传暂存目录（DLL 与 plan.json）给后续 job
        uses: actions/upload-artifact@v4
        with:
          name: staging
          path: .publish/staging
          retention-days: 3
          # .publish 是隐藏目录，upload-artifact@v4 默认不收录隐藏文件
          include-hidden-files: true
          if-no-files-found: error

  package:
    name: 打包 ${{ matrix.project }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 取回暂存目录
        uses: actions/download-artifact@v4
        with:
          name: staging
          path: .publish/staging

      - name: 压缩 ${{ matrix.project }}
        run: pwsh -NoProfile -File .github/scripts/package.ps1 -Project '${{ matrix.project }}'

      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.project }}
          path: .publish/dist
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: 上传到 Release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 取回所有压缩包
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: .publish/dist
          merge-multiple: true

      - name: 取回暂存目录（plan.json）
        uses: actions/download-artifact@v4
        with:
          name: staging
          path: .publish/staging

      - name: 上传压缩包并改写 Release
        run: pwsh -NoProfile -File .github/scripts/publish.ps1
